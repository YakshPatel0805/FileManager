<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Upload File</h3>
                        <form method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" name="file" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Upload</button>
                        </form>
                        <div class="mt-3 d-flex justify-content-between">
                            <a href="/show_files" class="btn btn-secondary">Show Files</a>
                            {% if session.get('is_admin') %}
                            <a href="/admin" class="btn btn-warning">Admin Dashboard</a>
                            {% endif %}
                            <a href="/logout" class="btn btn-danger">Logout</a>
                        </div>
                        {% if error %}<div class="alert alert-danger mt-2">{{ error }}</div>{% endif %}
                        {% if success %}<div class="alert alert-success mt-2">{{ success }}</div>{% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
