<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h3 class="mb-3">Uploaded Files</h3>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Uploaded By</th>
                    <th>Uploaded At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for file in files %}
                <tr>
                    <td>{{ file.filename }}</td>
                    <td>{{ file.uploaded_by }}</td>
                    <td>{{ file.upload_date.strftime("%Y-%m-%d %H:%M") if file.upload_date else "N/A" }}</td>
                    <td>
                        <a href="{{ url_for('get_file', file_id=file._id) }}" class="btn btn-sm btn-info">View</a>
                        <a href="{{ url_for('summarize', file_id=file._id) }}" class="btn btn-sm btn-info">Summarize</a>
                        {% if session.get('is_admin') %}
                        <form action="/delete_file/{{ file._id }}" method="POST" style="display:inline;"
                            onsubmit="return confirm('Delete this file?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/upload" class="btn btn-secondary">Back to Upload</a>
    </div>

</body>


</html>
